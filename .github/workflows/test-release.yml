name: Test release

# Pushing a branch named test-release/<build run ID> puts that build's tested
# packages on a GitHub pre-release (v<version>-test<N>), with a script that
# updates an installed Kulan OS to them and then deletes the downloads. The
# update channel is not touched: normal users stay on the released version.
on:
  push:
    branches: ["test-release/**"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Pre-release for testing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Which build
        id: run
        run: |
          set -euo pipefail
          RUN="${GITHUB_REF_NAME#test-release/}"
          # Only a number: it goes into API paths and the notes.
          [[ "${RUN}" =~ ^[0-9]{1,20}$ ]] || { echo "::error::the branch must be test-release/<build run ID>"; exit 1; }
          # Only a build of this repository's ISO workflow that passed every test.
          INFO="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}" \
                  --jq '[.head_sha, .conclusion, .path, .head_repository.full_name] | @tsv')"
          IFS=$'\t' read -r SHA CONCLUSION WORKFLOW FROM <<<"${INFO}"
          [[ "${CONCLUSION}" == success && "${WORKFLOW}" == .github/workflows/build-iso.yml && "${FROM}" == "${GITHUB_REPOSITORY}" ]] ||
            { echo "::error::run ${RUN} isn't a passed build of build-iso.yml in this repository (${CONCLUSION} ${WORKFLOW} ${FROM})"; exit 1; }
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no commit for run ${RUN}"; exit 1; }
          echo "run=${RUN}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v7
        with:
          name: kulan-debs
          path: debs/
          run-id: ${{ steps.run.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v7
        with:
          pattern: kulan-files-*
          path: debs/
          merge-multiple: true
          run-id: ${{ steps.run.outputs.run }}
          github-token: ${{ github.token }}
      - name: Make the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.run.outputs.run }}
          SHA: ${{ steps.run.outputs.sha }}
        run: |
          set -euo pipefail
          VERSION="$(cat debs/VERSION)"
          [[ "${VERSION}" =~ ^[0-9][A-Za-z0-9.+~-]{0,60}$ ]] || { echo "::error::odd version ${VERSION}"; exit 1; }
          SHORT="$(echo "${VERSION}" | cut -d. -f1-2)"
          N=1
          while gh release view "v${SHORT}-test${N}" >/dev/null 2>&1; do N=$((N + 1)); done
          TAG="v${SHORT}-test${N}"
          rm -f debs/VERSION
          (cd debs && sha256sum *.deb > SHA256SUMS)
          sed -e "s|@TAG@|${TAG}|g" -e "s|@REPO@|${GITHUB_REPOSITORY}|g" ci/test-update.sh > debs/kulan-test-update.sh
          gh release create "${TAG}" --prerelease --target "${SHA}" \
            --title "Kulan OS ${SHORT} test ${N} (not a release)" \
            --notes "Packages from build ${RUN} for testing on an installed Kulan OS. Not on the update channel. In Terminal: curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/kulan-test-update.sh | sh" \
            debs/*
          echo "::notice title=Test release::${TAG}"
