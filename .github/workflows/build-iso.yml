name: Build Kulan OS

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "assets/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      arch:
        description: Which ISO to build
        type: choice
        options: [both, arm64, amd64]
        default: both

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          CHOICE: ${{ inputs.arch || 'both' }}
        run: |
          arm='{"arch":"arm64","runner":"ubuntu-24.04-arm"}'
          amd='{"arch":"amd64","runner":"ubuntu-24.04"}'
          case "$CHOICE" in
            arm64) list="[$arm]" ;;
            amd64) list="[$amd]" ;;
            *)     list="[$arm,$amd]" ;;
          esac
          echo "matrix={\"include\":$list}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ISO (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # A GNOME image needs ~15 GB of scratch space; the runner image ships
      # with toolchains we don't use, so remove them first.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup \
            /usr/share/swift /opt/microsoft /opt/google
          sudo docker image prune --all --force || true
          df -h /

      - name: Build ISO in Debian 13
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/build" -w /build \
            debian:trixie bash ci/build-in-container.sh "${{ matrix.arch }}"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: kulan-os-${{ matrix.arch }}
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: |
            out/*.log
            build.log
          retention-days: 14
          if-no-files-found: ignore
