name: Build Kulan OS

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "assets/**"
      - "scripts/render-assets.py"
  workflow_dispatch:
    inputs:
      arch:
        description: Which ISO to build
        type: choice
        options: [both, arm64, amd64]
        default: both

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The build number shows in ISO file names and Settings > About.
env:
  KULAN_BUILD: ${{ github.run_number }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          CHOICE: ${{ inputs.arch || 'both' }}
        run: |
          arm='{"arch":"arm64","runner":"ubuntu-24.04-arm"}'
          amd='{"arch":"amd64","runner":"ubuntu-24.04"}'
          case "$CHOICE" in
            arm64) list="[$arm]" ;;
            amd64) list="[$amd]" ;;
            *)     list="[$arm,$amd]" ;;
          esac
          echo "matrix={\"include\":$list}" >> "$GITHUB_OUTPUT"

  packages:
    name: Kulan packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Build kulan-base, kulan-desktop-settings, kulan-welcome
        run: packages/build-debs.sh
      - name: Check packages
        run: |
          for deb in dist/debs/*.deb; do
            echo "== $deb"
            dpkg-deb --info "$deb" | sed -n '/Package:/,/Description:/p'
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: kulan-debs
          path: dist/debs/
          if-no-files-found: error
          retention-days: 14

  # llama.cpp's server for Kulan Assistant, one package per architecture.
  # Rebuilt only when ci/build-engine.sh changes (it pins the llama.cpp
  # release); otherwise the cached package is reused.
  engine:
    needs: plan
    name: Assistant engine (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: dist/engine
          key: kulan-engine-${{ matrix.arch }}-${{ hashFiles('ci/build-engine.sh', 'kulan.conf') }}
      - name: Build kulan-assistant-engine in Debian 13
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/build" -w /build debian:trixie bash ci/build-engine.sh
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: Check the package
        run: |
          ls -l dist/engine/
          dpkg-deb --info dist/engine/kulan-assistant-engine_*_${{ matrix.arch }}.deb | sed -n '/Package:/,/Description:/p'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: kulan-engine-${{ matrix.arch }}
          path: dist/engine/*.deb
          if-no-files-found: error
          retention-days: 14

  # Kulan Files: Debian 13's Nautilus with Kulan's patch, and Debian 13's
  # gnome-user-share (file sharing) on a fixed port, one build per
  # architecture. Rebuilt when a change or a script changes, or when Debian
  # updates either (their versions are part of the cache key).
  files:
    needs: plan
    name: Kulan Files (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Which Nautilus Debian has
        id: debian
        run: |
          VERSION="$(docker run --rm -v "$GITHUB_WORKSPACE:/build" -w /build debian:trixie bash ci/build-nautilus.sh --version | tail -n 1)"
          SHARE="$(docker run --rm -v "$GITHUB_WORKSPACE:/build" -w /build debian:trixie bash ci/build-user-share.sh --version | tail -n 1)"
          echo "Debian's Nautilus: ${VERSION}; gnome-user-share: ${SHARE}"
          echo "version=${VERSION}-${SHARE}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: dist/files
          key: kulan-files-${{ matrix.arch }}-${{ steps.debian.outputs.version }}-${{ hashFiles('ci/build-nautilus.sh', 'ci/build-user-share.sh', 'packages-src/**') }}
      - name: Build Kulan Files in Debian 13
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/build" -w /build debian:trixie bash ci/build-nautilus.sh
          docker run --rm -v "$GITHUB_WORKSPACE:/build" -w /build debian:trixie bash ci/build-user-share.sh
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: Check the packages
        run: |
          ls -l dist/files/
          dpkg-deb --info dist/files/nautilus_*_${{ matrix.arch }}.deb | sed -n '/Package:/,/Description:/p'
          dpkg-deb --info dist/files/gnome-user-share_*_${{ matrix.arch }}.deb | sed -n '/Package:/,/Version:/p'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: kulan-files-${{ matrix.arch }}
          path: dist/files/*.deb
          if-no-files-found: error
          retention-days: 14

  # Installs the packages into a clean Debian 13 system with their real
  # dependencies, checks them, removes them. Gates publishing and ISOs.
  test-packages:
    needs: [packages, engine, files]
    # The engine for PCs is tested with a real model when it was built.
    if: ${{ !cancelled() && needs.packages.result == 'success' }}
    name: Test packages on Debian 13
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: kulan-debs
          path: dist/debs/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: kulan-engine-amd64
          path: dist/engine/
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: kulan-files-amd64
          path: dist/files/
          merge-multiple: true
      # A Kulan Files version the channel already has: test the channel's file
      # (what installed systems get), see ci/use-channel-files.sh.
      - name: Match the update channel's Kulan Files
        run: ci/use-channel-files.sh dist/files
      - name: Install, check and remove in Debian 13
        run: |
          docker run --rm -e GITHUB_STEP_SUMMARY=/build/summary.md \
            -v "$GITHUB_WORKSPACE:/build" -w /build \
            debian:trixie bash ci/test-packages.sh
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

  # People in Kulan Fleet across two computers: the test server (the real
  # Fleet functions) and two Debian 13 laptops with this build's kulan-base,
  # signing in through PAM as GDM does. See ci/fleet-two-computers.sh.
  fleet-people:
    needs: [packages]
    name: Fleet people on two computers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: kulan-debs
          path: dist/debs/
      - name: Two laptops, one test server
        run: ci/fleet-two-computers.sh dist/debs

  # Publishes the packages to the update channel only after everything has
  # passed: the package tests, the upgrade test, and both ISOs' checks, boot,
  # low-end boot, install, TPM and speed tests. Installed computers update from the
  # channel automatically, so nothing reaches them that hasn't been through
  # every test. (The ISO build reads the channel already online - the
  # previous release - so it doesn't need this build published first.)
  # Skipped until scripts/setup-update-channel.sh has been run.
  publish:
    needs: [test-packages, engine, files, build, upgrade-test, fleet-people]
    # Only runs that built both architectures publish: the channel is
    # rebuilt from scratch each time and must keep both engines.
    if: >-
      github.ref == 'refs/heads/main' && (inputs.arch || 'both') == 'both' && !cancelled() &&
      needs.test-packages.result == 'success' && needs.build.result == 'success' &&
      needs.upgrade-test.result == 'success' && needs.fleet-people.result == 'success'
    name: Publish updates
    runs-on: ubuntu-24.04
    # Never at the same time as the weekly re-sign (resign-channel.yml).
    concurrency:
      group: update-channel
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Is the update channel set up?
        id: ready
        env:
          KEY: ${{ secrets.KULAN_APT_SIGNING_KEY }}
        run: |
          if [ -n "$KEY" ] && [ -f packages/kulan-archive-keyring.gpg ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Update channel::Not set up yet - run scripts/setup-update-channel.sh to switch it on."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        if: steps.ready.outputs.ready == 'true'
        with:
          name: kulan-debs
          path: dist/debs/

      # Both engines, for systems that add Kulan Assistant from Add-ons. By
      # name, so a missing one stops publishing instead of dropping it.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        if: steps.ready.outputs.ready == 'true'
        with:
          name: kulan-engine-amd64
          path: dist/debs/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        if: steps.ready.outputs.ready == 'true'
        with:
          name: kulan-engine-arm64
          path: dist/debs/

      # Kulan Files for both architectures. The architecture-independent
      # packages (nautilus-data) are built on both with the same version but
      # not byte for byte the same, so only the PC build's copy is published.
      # The ISOs use that same copy (see "Use the PC build's shared packages"):
      # a different file under the same version made apt in the image build
      # want to "downgrade" to the channel's copy, and stop.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        if: steps.ready.outputs.ready == 'true'
        with:
          name: kulan-files-arm64
          path: dist/files-arm64/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        if: steps.ready.outputs.ready == 'true'
        with:
          name: kulan-files-amd64
          path: dist/debs/
      - name: Add the Arm-only Kulan Files packages
        if: steps.ready.outputs.ready == 'true'
        run: |
          for deb in dist/files-arm64/*.deb; do
            case "$deb" in *_all.deb) continue ;; esac
            cp -v "$deb" dist/debs/
          done
          rm -rf dist/files-arm64

      # Never publish different bytes under a version the channel already
      # has: installed systems would see it as a downgrade and stop updating.
      - name: Keep the update channel's Kulan Files where the version is unchanged
        if: steps.ready.outputs.ready == 'true'
        run: ci/use-channel-files.sh dist/debs

      - name: Build signed package repository
        if: steps.ready.outputs.ready == 'true'
        env:
          KULAN_APT_SIGNING_KEY: ${{ secrets.KULAN_APT_SIGNING_KEY }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q apt-utils gnupg xz-utils
          ci/publish-repo.sh

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: steps.ready.outputs.ready == 'true'
        with:
          path: site/

      - id: deploy
        if: steps.ready.outputs.ready == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

      - name: Wait until the update channel serves this version
        if: steps.ready.outputs.ready == 'true'
        run: |
          . ./kulan.conf
          VERSION="$(cat dist/debs/VERSION)"
          for attempt in $(seq 1 30); do
            if curl -fsSL --max-time 20 "${KULAN_APT_URL}Packages" 2>/dev/null | grep -qx "Version: ${VERSION}"; then
              echo "::notice title=Update channel::Live at ${KULAN_APT_URL} with ${VERSION}"
              exit 0
            fi
            echo "Not live yet (attempt ${attempt}/30); waiting..."
            sleep 20
          done
          echo "::error title=Update channel::${KULAN_APT_URL} is not serving ${VERSION} after 10 minutes"
          exit 1

  # Upgrade test: install the previous release (the latest GitHub Release's
  # PC ISO), update it to this build's packages through Software Update's
  # own commands, restart, and check it comes back with every Kulan package
  # updated and nothing half-installed. Protects everyone already on Kulan
  # OS: publishing waits for it.
  upgrade-test:
    needs: [packages, engine, files, test-packages]
    if: >-
      !cancelled() && (inputs.arch || 'both') != 'arm64' &&
      needs.test-packages.result == 'success' &&
      needs.engine.result == 'success' && needs.files.result == 'success'
    name: Upgrade test (${{ matrix.from }} release to this build)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # The last two releases: computers that skipped one update jump straight
    # to this build, so that path is tested too.
    strategy:
      fail-fast: false
      matrix:
        from: [previous, older]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: kulan-debs
          path: dist/debs/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: kulan-engine-amd64
          path: dist/debs/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: kulan-files-amd64
          path: dist/debs/
      # The same files the update channel will get (see publish).
      - name: Match the update channel's Kulan Files
        run: ci/use-channel-files.sh dist/debs

      - name: Get the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Real releases only (test builds are pre-releases), newest first.
          INDEX=0; [ "${{ matrix.from }}" = older ] && INDEX=1
          TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            -q "[.[] | select(.draft == false and .prerelease == false)] | sort_by(.published_at) | reverse | .[${INDEX}].tag_name // empty")"
          [ -n "${TAG}" ] || { echo "::error::no ${{ matrix.from }} release found"; exit 1; }
          mkdir -p previous
          gh release download "${TAG}" --repo "$GITHUB_REPOSITORY" -D previous \
            --pattern kulan-os-amd64.iso --pattern SHA256SUMS --pattern SHA256SUMS.sig
          cd previous
          gpgv --keyring ../packages/kulan-archive-keyring.gpg SHA256SUMS.sig SHA256SUMS
          grep ' kulan-os-amd64.iso$' SHA256SUMS | sha256sum -c -
          echo "::notice title=Upgrade test (${{ matrix.from }})::from ${TAG}"

      - name: Upgrade test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf squashfs-tools dosfstools fdisk e2fsprogs parted xorriso apt-utils gnupg
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ci/upgrade-test.sh previous/kulan-os-amd64.iso dist/debs upgrade-test

      - name: Upload upgrade test
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: upgrade-test-amd64-${{ matrix.from }}
          path: upgrade-test/
          retention-days: 14
          if-no-files-found: ignore

  build:
    needs: [plan, packages, engine, files, test-packages]
    # Runs once the packages passed their tests; the update channel is only
    # published after this (see publish).
    if: >-
      !cancelled() &&
      needs.test-packages.result == 'success' &&
      needs.engine.result == 'success' &&
      needs.files.result == 'success'
    name: ISO (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Get the Kulan packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: kulan-debs
          path: config/packages.chroot/

      - name: Get the assistant engine
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: kulan-engine-${{ matrix.arch }}
          path: config/packages.chroot/

      - name: Get Kulan Files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: kulan-files-${{ matrix.arch }}
          path: config/packages.chroot/

      # The update channel carries the PC build's architecture-independent
      # packages; the image must hold the very same files (see publish).
      - name: Get the PC build's shared packages
        if: matrix.arch != 'amd64'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: kulan-files-amd64
          path: dist/files-amd64/
      - name: Use the PC build's shared packages
        if: matrix.arch != 'amd64'
        run: |
          for deb in dist/files-amd64/*_all.deb; do
            cp -v "$deb" config/packages.chroot/
          done
          rm -rf dist/files-amd64

      # The image build reads the update channel too: its Kulan Files and the
      # image's must be the same files (see ci/use-channel-files.sh).
      - name: Match the update channel's Kulan Files
        run: ci/use-channel-files.sh config/packages.chroot

      # A GNOME image needs ~15 GB of scratch space; the runner image ships
      # with toolchains we don't use, so remove them first.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup \
            /usr/share/swift /opt/microsoft /opt/google
          sudo docker image prune --all --force || true
          df -h /

      - name: Build ISO in Debian 13
        run: |
          docker run --rm --privileged -e KULAN_BUILD \
            -v "$GITHUB_WORKSPACE:/build" -w /build \
            debian:trixie bash ci/build-in-container.sh "${{ matrix.arch }}"

      # On failure, put the end of the build log where it can be read
      # without downloading anything (annotations and the run summary).
      - name: Show build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          # GitHub shows at most 10 error notes per step: the end of the log
          # first (it usually says what stopped the build), then up to 8 real
          # error lines (not apt's progress lines for packages named *error*).
          echo "::error title=ISO ${{ matrix.arch }} build ended with::$(tail -n 20 build.log | cut -c1-200 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          grep -nE '^(E|W): |[Ee]rror|Failed to fetch|returned error' build.log |
            grep -vE ':(Setting up|Unpacking|Selecting previously|Preparing to unpack|Get:[0-9]+) ' | tail -n 8 |
            while IFS= read -r line; do
              echo "::error title=ISO ${{ matrix.arch }} build::${line:0:400}"
            done
          { echo '### Last 60 lines of build.log'; echo '```'; tail -n 60 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect ISO
        env:
          KULAN_SAVE_STATUS: ${{ runner.temp }}/dpkg-status
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xorriso squashfs-tools initramfs-tools-core zstd
          ci/verify-iso.sh out/*.iso "${{ matrix.arch }}"

      # Known vulnerabilities in the ISO's Debian packages (Debian's security
      # tracker). A serious one Debian has already fixed fails the build.
      - name: Known vulnerabilities
        run: |
          sudo apt-get install -y -q debsecan
          ci/vuln-scan.sh "${{ runner.temp }}/dpkg-status"

      - name: Upload ISO
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: kulan-os-${{ matrix.arch }}
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      # Boot the PC ISO in a virtual machine (KVM) and check the live desktop
      # comes up with no failed services. After the upload, so a failing
      # test still leaves the ISO to look at.
      - name: Boot test
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get install -y -q qemu-system-x86 python3-pil tesseract-ocr
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ci/boot-test.sh out/*.iso boot-test

      # The same on a small computer: 2 GB of memory and one processor.
      - name: Low-end boot test
        if: matrix.arch == 'amd64'
        env:
          KULAN_BOOT_MEMORY: "2048"
          KULAN_BOOT_CPUS: "1"
          KULAN_BOOT_LABEL: Low-end boot test
        run: ci/boot-test.sh out/*.iso boot-test-low-end

      # Screenshots for os.kulangroup.com: the live desktop, Kulan Installer
      # and Kulan Settings at 1920x1080. Never fails the build.
      - name: Website screenshots
        if: matrix.arch == 'amd64'
        continue-on-error: true
        run: ci/screenshots.sh out/*.iso screenshots

      # Start-up and app-opening times from the screenshot step, against
      # ci/speed-budget.json: a build that got slower fails here.
      - name: Speed check
        if: matrix.arch == 'amd64'
        run: ci/check-speed.py screenshots/speed.json

      - name: Upload website screenshots
        if: always() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: screenshots-amd64
          path: |
            screenshots/*.png
            screenshots/speed.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload low-end boot test
        if: always() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: boot-test-low-end-amd64
          path: boot-test-low-end/
          retention-days: 14
          if-no-files-found: ignore

      # Install the PC ISO onto a virtual disk, start it, restart it, and
      # check both starts reach the desktop.
      - name: Install test
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get install -y -q ovmf squashfs-tools dosfstools fdisk e2fsprogs cryptsetup parted xorriso
          ci/install-test.sh out/*.iso install-test

      # Encrypted install with Secure Boot and an emulated TPM: turn TPM unlock
      # on, take every other key away, and check the next start opens the disk
      # by itself.
      - name: TPM unlock test
        if: matrix.arch == 'amd64'
        timeout-minutes: 60
        run: |
          sudo apt-get install -y -q ovmf swtpm swtpm-tools cryptsetup squashfs-tools dosfstools fdisk
          ci/tpm-test.sh out/*.iso tpm-test

      - name: Upload TPM unlock test
        if: always() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: tpm-test-amd64
          path: tpm-test/
          retention-days: 14
          if-no-files-found: ignore

      # The same with a start-up PIN (the recommended way): the test types the
      # PIN on the VM's keyboard at the second start.
      - name: TPM unlock with a PIN test
        if: matrix.arch == 'amd64'
        timeout-minutes: 60
        env:
          KULAN_TPM_TEST_PIN: "2468"
        run: ci/tpm-test.sh out/*.iso tpm-pin-test

      - name: Upload TPM unlock with a PIN test
        if: always() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: tpm-pin-test-amd64
          path: tpm-pin-test/
          retention-days: 14
          if-no-files-found: ignore

      # Signed start-up: turn it on, enroll the key on shim's blue screen (the
      # test presses the keys), start through the signed start-up files, then
      # TPM unlock tied to them.
      - name: Signed start-up test
        if: matrix.arch == 'amd64'
        timeout-minutes: 90
        run: |
          sudo apt-get install -y -q ovmf swtpm swtpm-tools cryptsetup squashfs-tools dosfstools fdisk python3-pil
          ci/signed-start-test.sh out/*.iso signed-start-test

      - name: Upload signed start-up test
        if: always() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: signed-start-test-amd64
          path: signed-start-test/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload install test
        if: always() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: install-test-amd64
          path: install-test/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload boot test
        if: always() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: boot-test-amd64
          path: boot-test/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: build-log-${{ matrix.arch }}
          path: |
            out/*.log
            build.log
          retention-days: 14
          if-no-files-found: ignore

  # A main build's ISOs as a GitHub Release (no login, no expiry), linked
  # from os.kulangroup.com/download/. Only when both ISOs passed their tests
  # and the update channel was published from this same build.
  release:
    needs: [build, publish]
    if: >-
      github.ref == 'refs/heads/main' && !cancelled() &&
      needs.build.result == 'success' && needs.publish.result == 'success'
    name: Publish the ISOs
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # The signing key is a secret of this environment only (main only; scripts/signing-key.sh).
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: kulan-os-amd64
          path: iso/amd64/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: kulan-os-arm64
          path: iso/arm64/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          KULAN_APT_SIGNING_KEY: ${{ secrets.KULAN_APT_SIGNING_KEY }}
        run: ci/make-release.sh iso

  # Keep the website screenshots on the site-screenshots branch, one folder
  # per build, so the site (and anyone without access to build artifacts) can
  # use them. Only the PNGs from this run go there.
  screenshots:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    name: Save website screenshots and test logs
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        id: get
        continue-on-error: true
        with:
          name: screenshots-amd64
          path: shots/
      - name: Commit to site-screenshots
        if: steps.get.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls shots/*.png >/dev/null 2>&1 || { echo "No screenshots in this run"; exit 0; }
          git init -q repo && cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin site-screenshots; then git checkout -q -b site-screenshots FETCH_HEAD; else git checkout -q --orphan site-screenshots; fi
          DIR="${REF//\//-}/${RUN}"
          mkdir -p "${DIR}" "${REF//\//-}/latest"
          cp ../shots/*.png "${DIR}/"
          rm -f "${REF//\//-}/latest/"*.png
          cp ../shots/*.png "${REF//\//-}/latest/"
          git add -A
          git commit -q -m "Screenshots from run ${RUN} (${REF})"
          git push -q origin site-screenshots
          echo "::notice title=Screenshots::saved to site-screenshots/${DIR}"

      # The virtual-machine tests' logs and screenshots, on the ci-diagnostics
      # branch (one folder per run), for reading a failure without the
      # Actions artifacts. Logs and pictures only, at most 2 MB each.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        id: tests
        continue-on-error: true
        with:
          pattern: "{boot-test,boot-test-low-end,install-test,tpm-test,tpm-pin-test,signed-start-test}-amd64"
          path: tests/
      - name: Commit to ci-diagnostics
        if: steps.tests.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -d tests ] || { echo "No test logs in this run"; exit 0; }
          rm -rf diag && git init -q diag && cd diag
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ci-diagnostics; then git checkout -q -b ci-diagnostics FETCH_HEAD; else git checkout -q --orphan ci-diagnostics; fi
          mkdir -p "${RUN}"
          (cd ../tests && find . -type f \( -name '*.log' -o -name '*.png' -o -name '*.txt' \) -size -2M -print0) |
            while IFS= read -r -d '' f; do mkdir -p "${RUN}/$(dirname "$f")"; cp "../tests/$f" "${RUN}/$f"; done
          git add -A
          git diff --cached --quiet && { echo "Nothing to save"; exit 0; }
          git commit -q -m "Test logs from run ${RUN}"
          git push -q origin ci-diagnostics
          echo "::notice title=Test logs::saved to ci-diagnostics/${RUN}"
