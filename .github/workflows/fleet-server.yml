name: Fleet server

# The Kulan Fleet and weekly-count servers (Supabase Edge Functions and their
# migrations), tested before anything is deployed: every migration on a real
# Postgres (twice, to show they're safe to run again), the functions'
# TypeScript checked with Deno, and the functions run against that database.
# Deploying stays a separate, deliberate step at release.
on:
  push:
    paths: ["fleet/**", ".github/workflows/fleet-server.yml", "packages/kulan-base/root/usr/share/kulan-fleet/**",
            "packages/kulan-settings/root/usr/lib/kulan/kulan-remote-help", "ci/remotehelp-*.py"]
  pull_request:
    paths: ["fleet/**", ".github/workflows/fleet-server.yml", "packages/kulan-base/root/usr/share/kulan-fleet/**",
            "packages/kulan-settings/root/usr/lib/kulan/kulan-remote-help", "ci/remotehelp-*.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Fleet server tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.x
      - name: Type-check the functions
        run: |
          for f in fleet fleet-admin countme; do deno check "fleet/supabase/functions/$f/index.ts"; done
          deno check fleet/test-server/serve.ts
          cmp fleet/supabase/functions/fleet/policy.ts fleet/supabase/functions/fleet-admin/policy.ts
          cmp fleet/supabase/functions/fleet/help.ts fleet/supabase/functions/fleet-admin/help.ts
          for f in actions.ts secrets.ts; do cmp "fleet/supabase/functions/fleet/$f" "fleet/supabase/functions/fleet-admin/$f"; done
          bash -n fleet/test-server/setup.sh && bash -n fleet/test-server/run.sh && bash -n fleet/test-server/teardown.sh
      - name: Weekly count
        working-directory: fleet/supabase/functions/countme
        run: |
          node --experimental-strip-types week.test.ts
          node --experimental-strip-types index.test.mjs
      - name: Fleet and People against Postgres
        working-directory: fleet/test
        env:
          FLEET_TEST_DB: postgres://postgres@localhost:5432/postgres
        run: |
          npm ci --no-audit --no-fund
          node --experimental-strip-types functions.test.mjs
          node sha512crypt.test.mjs
      - name: Remote help end to end (the viewer in Chromium, the helper's WebRTC)
        working-directory: fleet/test
        env:
          FLEET_TEST_DB: postgres://postgres@localhost:5432/postgres
          PYTHON: /usr/bin/python3
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends python3-gi gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gir1.2-gst-plugins-bad-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-nice
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          node --experimental-strip-types remotehelp.e2e.mjs
          python3 -I -B ../../ci/remotehelp-test.py
          python3 -I -B ../../ci/remotehelp-helper-test.py

  dashboard:
    name: Web dashboard in a browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Every flow, clicked through
        working-directory: fleet/test
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          node dashboard.test.cjs ../dashboard

  test-server:
    name: Test server (setup, sign-in, teardown)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set it up as on a test computer
        working-directory: fleet/test-server
        run: sudo ./setup.sh ci@kulan.example
      - name: Sign in, add an organisation, join a computer
        working-directory: fleet/test-server
        run: |
          set -euo pipefail
          sudo ./run.sh > /tmp/server.log 2>&1 &
          IP="$(sudo cat /opt/kulan-fleet-test/address)"
          B="https://${IP}:8443"
          for i in $(seq 60); do curl -fs "${B}/kulan-fleet-test-ca.crt" -o /dev/null && break; sleep 2; done
          curl -fsS -X POST "${B}/auth/v1/otp" -d '{"email":"ci@kulan.example"}'
          CODE="$(grep -o 'ci@kulan.example: [0-9]*' /tmp/server.log | awk '{print $2}')"
          TOK="$(curl -fsS -X POST "${B}/auth/v1/verify" -d "{\"type\":\"email\",\"email\":\"ci@kulan.example\",\"token\":\"${CODE}\"}" | jq -r .access_token)"
          adm() { curl -fsS -X POST "${B}/functions/v1/fleet-admin" -H "Authorization: Bearer ${TOK}" -d "$1"; }
          ORG="$(adm '{"op":"new-organisation","name":"CI"}' | jq -r .id)"
          JOIN="$(adm "{\"op\":\"new-code\",\"organisation_id\":\"${ORG}\"}" | jq -r .code)"
          DEV="$(curl -fsS -X POST "${B}/functions/v1/fleet/v1/enrol" -d "{\"code\":\"${JOIN}\",\"hostname\":\"ci\"}")"
          echo "${DEV}" | jq -e '.device_id and .token' >/dev/null
          adm '{"op":"overview"}' | jq -e '.devices | length == 1' >/dev/null
          echo "test server works"
          cat /tmp/server.log
      - name: Teardown leaves nothing
        working-directory: fleet/test-server
        run: |
          sudo pkill -f 'deno run' || true
          sudo ./teardown.sh
          test ! -e /opt/kulan-fleet-test && test ! -e /usr/local/share/ca-certificates/kulan-fleet-test.crt
          # PostgreSQL stays only if it was there before (it is on GitHub's runners); the test database doesn't.
          if command -v psql >/dev/null && systemctl is-active -q postgresql; then ! sudo -u postgres psql -lqt | cut -d'|' -f1 | grep -qw kulanfleet; fi
