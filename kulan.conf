# Kulan OS identity - the single source of truth for branding.
#
# Change a value here and every place that shows it (boot menu, login,
# Settings > About, installer, ISO file name) follows on the next build.
# After changing KULAN_NAME or KULAN_VERSION, re-render the images:
#     python3 scripts/render-assets.py
#
# Keep values free of double quotes. KULAN_ID, KULAN_HOSTNAME and
# KULAN_LIVE_USER must be lowercase letters, digits and dashes only.

KULAN_NAME="Kulan OS"
KULAN_SHORT_NAME="Kulan"
KULAN_ID="kulan"
KULAN_VERSION="2.10.0"
# What people see (Settings > About, the boot menu, the installer, the
# website): releases come in steps (2.8a, 2.8b..., 2.9a...) while KULAN_VERSION stays a
# plain number (2.8.1, 2.9.1...) for apt, the weekly count and the release
# notes. Leave it out and KULAN_VERSION is shown.
KULAN_VERSION_LABEL="2.10"
KULAN_PUBLISHER="Kulan Group LLC"
KULAN_HOME_URL="https://os.kulangroup.com"
KULAN_SUPPORT_URL="https://os.kulangroup.com/help/"
# Contact address shown in the packages (public). A GitHub no-reply address
# keeps your personal email private.
KULAN_MAINTAINER_EMAIL="mmohamud25@users.noreply.github.com"

# Update channel: where installed systems fetch Kulan OS updates.
# GitHub Pages for this repo; switched on by scripts/setup-update-channel.sh.
KULAN_APT_URL="https://os.kulangroup.com/apt/"
# The only packages the update channel may install or update (apt patterns).
# Installed systems pin everything else from the channel to "never", so even
# a channel signed with a stolen key can't replace Debian's packages (sudo,
# ssh); ci/publish-repo.sh refuses to publish any other package.
KULAN_CHANNEL_PACKAGES="kulan-* nautilus nautilus-data libnautilus-extension* gir1.2-nautilus* gnome-user-share"

# Debian release this is built on. trixie = Debian 13 (current stable).
KULAN_DEBIAN_SUITE="trixie"
KULAN_DEBIAN_VERSION="13"

# Live session (what you get when you boot the ISO before installing).
KULAN_HOSTNAME="kulan-os"
KULAN_LIVE_USER="kulan"
