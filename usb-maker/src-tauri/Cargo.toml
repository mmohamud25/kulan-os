[package]
name = "kulan-usb-maker"
version = "1.0.0"
description = "Kulan USB Maker: makes a Kulan OS USB stick"
authors = ["Kulan Group LLC"]
edition = "2021"

[[bin]]
name = "kulan-usb-maker"
path = "src/main.rs"

[features]
# Tests only: stand-in USB sticks named in KULAN_USB_MAKER_TEST_DEVICES.
test-devices = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
pgp = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots"] }
dirs = "6"
plist = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
