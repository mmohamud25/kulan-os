  <path d="M0 1610 C 700 1530, 1380 1670, 2100 1580 S 3300 1530, 3840 1590" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/>
  <path d="M0 1840 C 820 1760, 1560 1920, 2380 1820 S 3480 1760, 3840 1800 L 3840 2160 L 0 2160 Z" fill="url(#h3)"/>
