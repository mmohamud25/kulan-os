<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <!-- Kulan OS default wallpaper (light): dawn over the savanna, a lone acacia
       on the horizon - the gathering tree from the Kulan OS logo. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6F6F8"/>
      <stop offset="0.5" stop-color="#D3F1EC"/>
      <stop offset="0.74" stop-color="#FCE9C4"/>
      <stop offset="0.82" stop-color="#FBD38D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.66" cy="0.70" r="0.40">
      <stop offset="0" stop-color="#FDE68A" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#FCD34D" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FCD34D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF7E0"/>
      <stop offset="0.7" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </radialGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DD3C8"/>
      <stop offset="1" stop-color="#5CC2B8"/>
    </linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2AA198"/>
      <stop offset="1" stop-color="#14857F"/>
    </linearGradient>
    <linearGradient id="h3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F5E63"/>
      <stop offset="1" stop-color="#0B3B4A"/>
    </linearGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#sky)"/>
  <rect width="3840" height="2160" fill="url(#glow)"/>
  <circle cx="2540" cy="1500" r="230" fill="url(#sun)"/>
  <path d="M0 1500 C 520 1430, 1100 1520, 1700 1470 S 2900 1400, 3840 1460 L 3840 2160 L 0 2160 Z" fill="url(#h1)"/>
  <g fill="#0B2A4A">
