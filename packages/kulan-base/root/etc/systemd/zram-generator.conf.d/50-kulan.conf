# Kulan OS: compressed swap in memory (zram). Half of the RAM, at most 8 GB,
# compressed with zstd: memory-hungry moments slow down a little instead of
# freezing, and nothing is written to the disk. Used before any swap file.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
