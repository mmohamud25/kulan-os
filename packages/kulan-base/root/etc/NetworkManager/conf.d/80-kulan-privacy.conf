# Kulan OS network privacy defaults.
#
# Wi-Fi: use a random hardware (MAC) address while scanning, and a different
# stable address for each network you join, so you can't be tracked between
# networks. Ethernet is left alone so wired DHCP reservations keep working.
#
# IPv6: use temporary privacy addresses for outgoing connections.

[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=stable
ipv6.ip6-privacy=2
