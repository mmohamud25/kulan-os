# Kulan OS: settings for swap in compressed memory (zram), as Fedora and
# Pop!_OS use. Swapping to RAM is cheap, so the kernel may do it early, and
# reads one page at a time (zram has no seek cost).
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
