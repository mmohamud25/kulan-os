// Kulan OS Firefox setup (the first line of this file is always skipped).
// Firefox draws its own window buttons; this gives them Kulan's round red,
// yellow and green look, like every other app. Only adds a style sheet.
try {
  const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  const uri = Services.io.newURI("file:///usr/share/kulan/firefox/titlebar.css");
  if (!sss.sheetRegistered(uri, sss.USER_SHEET)) {
    sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
  }
} catch (e) {
  // Never stop Firefox from starting.
}

// Video decoded by the graphics chip (VA-API) where it can be, so a video
// playing doesn't keep the processor busy and slow everything else down.
// Defaults only: about:config can still change them.
defaultPref("media.hardware-video-decoding.enabled", true);
defaultPref("media.ffmpeg.vaapi.enabled", true);
