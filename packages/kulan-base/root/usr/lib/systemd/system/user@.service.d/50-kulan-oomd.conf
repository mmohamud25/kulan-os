# Kulan OS: when memory runs out, close the one app causing it instead of
# letting the whole computer freeze (systemd-oomd, as Fedora and Ubuntu do).
# Watches everything people run (their user session); the system's own
# services are never chosen. Kulan's notice says which app was closed.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
