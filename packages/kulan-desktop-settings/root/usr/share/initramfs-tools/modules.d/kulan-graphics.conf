# Kulan OS: load the virtual-machine graphics drivers at the very start of
# boot. Without them, VMs (UTM on Apple silicon, QEMU and GNOME Boxes use
# virtio graphics; VMware Fusion and Workstation use VMware's SVGA) show a
# frozen boot-menu picture until the login screen starts, hiding the boot
# splash and any password prompt. Harmless on other computers.
virtio_gpu
vmwgfx
