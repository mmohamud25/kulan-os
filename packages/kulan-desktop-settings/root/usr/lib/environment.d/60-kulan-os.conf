# Kulan OS: let Kulan's launcher overrides take precedence over the system
# ones (used to hide apps that don't belong on the Kulan desktop).
XDG_DATA_DIRS=/usr/share/kulan/xdg:${XDG_DATA_DIRS:-/usr/local/share/:/usr/share/}
# Qt apps (VLC, KeePassXC, the installer) use the GTK theme, fonts and file
# dialogs, so they look like the rest of Kulan OS.
QT_QPA_PLATFORMTHEME=gtk3
# Qt apps open through XWayland when they can, so GNOME draws their window
# frame with Kulan's red, yellow and green buttons (as a native Wayland window
# a Qt app draws plain buttons of its own). GNOME's native scaling for
# XWayland apps (experimental-features) keeps them sharp; apps without X11
# access fall back to Wayland.
QT_QPA_PLATFORM=xcb;wayland
