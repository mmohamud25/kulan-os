# Kulan OS boot: skip the text menu and show the boot splash instead.
# Hold Esc (or Shift on BIOS PCs) while starting up to see the menu.
#
# GRUB_DISTRIBUTOR comes from os-release ("Kulan OS"). grub-install would name
# GRUB's EFI folder after it (EFI/kulan); kulan-base's grub-install keeps
# Debian's Secure Boot-signed GRUB in EFI/debian.
#
# After a start-up that didn't reach the desktop, the menu shows by itself
# for 10 seconds (kulan-update-center's /etc/grub.d/01_kulan-boot-check):
# each Linux version on its own line, newest first, so the earlier one is one
# arrow key away, then "Undo the last update". No "recovery mode" entries:
# they ask for a root password, and Kulan OS has none.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=1
GRUB_DISABLE_SUBMENU=true
GRUB_DISABLE_RECOVERY=true
GRUB_BACKGROUND=/usr/share/kulan/grub-background.png
# Append (never replace): the installer may have added options such as
# disk-encryption settings to this line.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} splash"

# ARM computers and VMs (UTM on Apple silicon) often announce a serial port
# that Linux then uses as its only console, so the boot splash and the disk
# password prompt never reach the screen. List the serial console first and
# the screen last (the last console is where prompts appear), and tell the
# splash to ignore serial consoles (it otherwise switches to text on them).
case "$(dpkg --print-architecture 2>/dev/null)" in
	arm64)
		# Leave consoles someone already chose (on either line) alone.
		case " ${GRUB_CMDLINE_LINUX} ${GRUB_CMDLINE_LINUX_DEFAULT} " in
			*" console="*) ;;
			*) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} console=ttyAMA0 console=tty0 plymouth.ignore-serial-consoles" ;;
		esac
		;;
esac
