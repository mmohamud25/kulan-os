# Kulan OS boot: skip the text menu and show the boot splash instead.
# Hold Esc (or Shift on BIOS PCs) while starting up to see the menu.
#
# GRUB_DISTRIBUTOR is deliberately left alone: Debian's Secure Boot-signed
# GRUB must stay in EFI/debian, and grub-install derives that from it.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=2
GRUB_BACKGROUND=/usr/share/kulan/grub-background.png
# Append (never replace): the installer may have added options such as
# disk-encryption settings to this line.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} splash"
