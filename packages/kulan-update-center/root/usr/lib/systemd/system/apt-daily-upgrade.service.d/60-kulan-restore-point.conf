# Kulan OS: before automatic updates take apt's lock, a restore point (once a
# day, only when updates are about to install), so "Undo the last update"
# covers them and Install in Software Update never waits behind a snapshot.
# Only exit status 75 skips this run: the restore point left too little room
# for the updates (restore-points before-auto-update).
[Unit]
After=kulan-update-repair.service

[Service]
ExecCondition=/bin/sh -c '/usr/bin/timeout 1800 /usr/lib/kulan/restore-points before-auto-update; [ $$? -ne 75 ]'
# Software Update's status once, at the end, not after each of their many
# small dpkg runs.
Environment=KULAN_DEFER_STATUS=1
ExecStopPost=-/usr/lib/kulan/update-status refresh
