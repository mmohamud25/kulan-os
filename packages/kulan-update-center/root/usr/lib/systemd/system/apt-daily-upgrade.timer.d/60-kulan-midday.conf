# Kulan OS: automatic updates around midday, or an hour after start-up,
# instead of at 6 in the morning and so straight after you switch on. apt
# itself installs at most once a day, however often this fires.
[Timer]
OnCalendar=
OnCalendar=*-*-* 12:00
RandomizedDelaySec=1h
Persistent=false
OnBootSec=1h
